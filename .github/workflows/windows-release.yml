name: Windows x64 release

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Windows x64 preview
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Go for the pinned Xray module
        uses: actions/setup-go@v6
        with:
          go-version-file: xray/go.mod
          cache: true
          cache-dependency-path: xray/go.sum

      - name: Enable Windows desktop target
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name bpb .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart -Force }

      - name: Build bundled Cloudflare Worker asset
        shell: pwsh
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run minify

      - name: Fetch Tor bridge asset
        shell: bash
        run: bash scripts/fetch_tor_bridges.sh

      - name: Fetch Xray geo databases
        shell: bash
        run: bash scripts/fetch_geo.sh

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Build and stage Xray
        shell: pwsh
        run: ./scripts/build_xray_windows.ps1

      - name: Package portable Windows build
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $zip = "dist/BPB-VPN-Windows-x64-preview.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BPB-VPN-Windows-x64-preview.zip" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPB-VPN-Windows-x64
          path: |
            dist/BPB-VPN-Windows-x64-preview.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          name: BPB VPN ${{ github.ref_name }} — Windows x64 Preview
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/BPB-VPN-Windows-x64-preview.zip
            dist/SHA256SUMS.txt
          body: |
            **Experimental Windows proxy-mode preview. Not a full VPN/TUN release.**

            - Windows 10/11 x64.
            - Uses the bundled Xray core and current-user Windows system proxy.
            - TUN/Wintun, Psiphon, Tor exits, tray integration, installer, and code signing are not included.
            - This CI build is not a substitute for manual connect/disconnect and crash-recovery testing on a real Windows PC.

            Extract the ZIP and run `bpb.exe`. Keep the whole extracted folder together.
            Review the included README and Windows preview notes before use.
